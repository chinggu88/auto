<!-- @dsCard group="행동" height=176 subtitle="주 버튼 하나 + 보조 버튼" -->
<div id="root">
  <style>
    body{margin:0;background:var(--surface);font-family:var(--font-sans)}
    .w{padding:var(--space-4);display:grid;gap:var(--space-3);max-width:440px}
    .bar{display:flex;gap:var(--space-2)}
    button{font-family:var(--font-sans);border-radius:var(--radius-md);cursor:pointer}
    .pri{height:36px;width:100%;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
    .run{height:36px;width:100%;font-size:13px;font-weight:700;background:var(--surface-raised);color:var(--ink);border:1px solid var(--line-strong)}
    .sec{height:28px;padding:0 var(--space-3);font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
    .sec.focus{outline:2px solid var(--accent);outline-offset:1px}
    .sec:disabled{color:var(--ink-muted);border-color:var(--line);cursor:default}
  </style>
  <div class="w">
    <div class="bar"><button class="sec focus">설정 저장</button><button class="sec">설정 불러오기</button><button class="sec" disabled>기본값</button></div>
    <button class="pri">시작하기</button>
    <button class="run">동작 중  (tab = 정지)</button>
  </div>
</div>
<script></script>
